apply plugin: 'com.android.application'
apply plugin: 'signing'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def novaProductionApplicationId = 'com.wpuu.novacalculator'
def requestedNovaApplicationId = (project.findProperty('novaApplicationId') ?: System.getenv('NOVA_ANDROID_PACKAGE_NAME') ?: '').toString().trim()
def configuredNovaGatewayUrl = (project.findProperty('novaAiGatewayUrl') ?: System.getenv('NOVA_AI_GATEWAY_URL') ?: '').toString().trim()
def configuredNovaSessionUrl = (project.findProperty('novaAnonymousSessionUrl') ?: System.getenv('NOVA_ANONYMOUS_SESSION_URL') ?: '').toString().trim()
def configuredNovaBillingUrl = (project.findProperty('novaBillingUrl') ?: System.getenv('NOVA_BILLING_URL') ?: '').toString().trim()
def configuredNovaPlayIntegrityProjectText = (project.findProperty('novaPlayIntegrityCloudProjectNumber') ?: System.getenv('NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER') ?: '0').toString().trim()
def configuredNovaVersionCodeText = (project.findProperty('novaVersionCode') ?: System.getenv('NOVA_VERSION_CODE') ?: '20001').toString().trim()
def configuredNovaVersionName = (project.findProperty('novaVersionName') ?: System.getenv('NOVA_VERSION_NAME') ?: '0.2.0-alpha01').toString().trim()
def configuredNovaUploadKeystorePath = (project.findProperty('novaUploadKeystorePath') ?: System.getenv('NOVA_UPLOAD_KEYSTORE_PATH') ?: '').toString().trim()
def configuredNovaUploadStorePassword = (project.findProperty('novaUploadStorePassword') ?: System.getenv('NOVA_UPLOAD_STORE_PASSWORD') ?: '').toString()
def configuredNovaUploadKeyAlias = (project.findProperty('novaUploadKeyAlias') ?: System.getenv('NOVA_UPLOAD_KEY_ALIAS') ?: '').toString().trim()
def configuredNovaUploadKeyPassword = (project.findProperty('novaUploadKeyPassword') ?: System.getenv('NOVA_UPLOAD_KEY_PASSWORD') ?: '').toString()
def configuredNovaVersionCode
def configuredNovaPlayIntegrityProject

if (requestedNovaApplicationId && requestedNovaApplicationId != novaProductionApplicationId) {
    throw new GradleException("Nova production applicationId is frozen as ${novaProductionApplicationId}; NOVA_ANDROID_PACKAGE_NAME must match it")
}
try {
    configuredNovaVersionCode = Integer.parseInt(configuredNovaVersionCodeText)
} catch (NumberFormatException ignored) {
    throw new GradleException('novaVersionCode/NOVA_VERSION_CODE must be an integer')
}
try {
    configuredNovaPlayIntegrityProject = Long.parseLong(configuredNovaPlayIntegrityProjectText)
} catch (NumberFormatException ignored) {
    throw new GradleException('novaPlayIntegrityCloudProjectNumber/NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER must be an integer')
}
if (configuredNovaVersionCode <= 0 || configuredNovaVersionCode > 2100000000) {
    throw new GradleException('Nova versionCode must be between 1 and 2100000000')
}
if (configuredNovaPlayIntegrityProject < 0L) {
    throw new GradleException('Nova Play Integrity Cloud project number must be zero (disabled) or positive')
}
if (!(configuredNovaVersionName ==~ /[0-9A-Za-z][0-9A-Za-z._-]{0,49}/)) {
    throw new GradleException('Nova versionName must be 1-50 characters using letters, numbers, dot, underscore or hyphen')
}

def uploadSigningValues = [
        configuredNovaUploadKeystorePath,
        configuredNovaUploadStorePassword,
        configuredNovaUploadKeyAlias,
        configuredNovaUploadKeyPassword,
]
def uploadSigningConfigured = uploadSigningValues.every { value -> value != null && !value.toString().isEmpty() }
def uploadSigningPartiallyConfigured = uploadSigningValues.any { value -> value != null && !value.toString().isEmpty() }
if (uploadSigningPartiallyConfigured && !uploadSigningConfigured) {
    throw new GradleException('Nova upload signing requires keystore path, store password, key alias and key password together')
}
if (uploadSigningConfigured && !file(configuredNovaUploadKeystorePath).isFile()) {
    throw new GradleException('NOVA_UPLOAD_KEYSTORE_PATH does not point to a file')
}

def buildConfigString = { String value ->
    value.replace('\\', '\\\\').replace('"', '\\"').replace('\r', '').replace('\n', '')
}

def isSafeHttpsEndpoint = { String value ->
    try {
        def uri = new java.net.URI(value == null ? '' : value.trim())
        return 'https'.equalsIgnoreCase(uri.scheme)
                && uri.host != null && !uri.host.trim().isEmpty()
                && uri.userInfo == null
                && uri.query == null
                && uri.fragment == null
    } catch (Exception ignored) {
        return false
    }
}

android {
    compileSdk versions.sdk.compile
    defaultConfig {
        // Production identity is frozen before the first Play upload. Debug builds remain isolated
        // with the .dev suffix below; store title/brand can still be Nova AutoTap.
        applicationId novaProductionApplicationId
        minSdkVersion versions.sdk.min
        targetSdkVersion versions.sdk.target
        versionCode configuredNovaVersionCode
        versionName configuredNovaVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'NOVA_AI_GATEWAY_URL', '"' + buildConfigString(configuredNovaGatewayUrl) + '"'
        buildConfigField 'String', 'NOVA_ANONYMOUS_SESSION_URL', '"' + buildConfigString(configuredNovaSessionUrl) + '"'
        buildConfigField 'String', 'NOVA_BILLING_URL', '"' + buildConfigString(configuredNovaBillingUrl) + '"'
        buildConfigField 'long', 'NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER', configuredNovaPlayIntegrityProject + 'L'
    }
    signingConfigs {
        if (uploadSigningConfigured) {
            releaseUpload {
                storeFile file(configuredNovaUploadKeystorePath)
                storePassword configuredNovaUploadStorePassword
                keyAlias configuredNovaUploadKeyAlias
                keyPassword configuredNovaUploadKeyPassword
            }
        }
    }
    buildFeatures {
        buildConfig true
        dataBinding true
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            if (uploadSigningConfigured) {
                signingConfig signingConfigs.releaseUpload
            }
        }
        debug {
            applicationIdSuffix ".dev"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-debug.cfg'
            multiDexEnabled true
        }
    }
    namespace 'org.solovyev.android.calculator'
    lint {
        abortOnError false
        disable 'ContentDescription', 'IconLauncherShape'
        warning 'MissingTranslation'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

tasks.register('verifyNovaPlayReleaseConfig') {
    group = 'verification'
    description = 'Fails unless Nova is configured for a signed Google Play release build.'
    doLast {
        if (android.defaultConfig.applicationId != novaProductionApplicationId) {
            throw new GradleException("Google Play release requires applicationId ${novaProductionApplicationId}")
        }
        if (!isSafeHttpsEndpoint(configuredNovaGatewayUrl)
                || !isSafeHttpsEndpoint(configuredNovaSessionUrl)
                || !isSafeHttpsEndpoint(configuredNovaBillingUrl)) {
            throw new GradleException('Google Play release requires HTTPS Nova AI, session and billing endpoints')
        }
        if (configuredNovaPlayIntegrityProject <= 0L) {
            throw new GradleException('Google Play release requires NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER')
        }
        if (!uploadSigningConfigured) {
            throw new GradleException('Google Play release requires the Nova upload keystore configuration')
        }
    }
}

tasks.matching { task -> task.name == 'bundleRelease' || task.name == 'assembleRelease' }.configureEach {
    dependsOn tasks.named('verifyNovaPlayReleaseConfig')
}

