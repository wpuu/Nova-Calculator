apply plugin: 'com.android.application'
apply plugin: 'signing'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def configuredNovaGatewayUrl = (project.findProperty('novaAiGatewayUrl') ?: System.getenv('NOVA_AI_GATEWAY_URL') ?: '').toString().trim()
def configuredNovaSessionUrl = (project.findProperty('novaAnonymousSessionUrl') ?: System.getenv('NOVA_ANONYMOUS_SESSION_URL') ?: '').toString().trim()
def configuredNovaBillingUrl = (project.findProperty('novaBillingUrl') ?: System.getenv('NOVA_BILLING_URL') ?: '').toString().trim()
def configuredNovaPlayIntegrityProjectText = (project.findProperty('novaPlayIntegrityCloudProjectNumber') ?: System.getenv('NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER') ?: '0').toString().trim()
def configuredNovaVersionCodeText = (project.findProperty('novaVersionCode') ?: System.getenv('NOVA_VERSION_CODE') ?: '20001').toString().trim()
def configuredNovaVersionName = (project.findProperty('novaVersionName') ?: System.getenv('NOVA_VERSION_NAME') ?: '0.2.0-alpha01').toString().trim()
def configuredNovaVersionCode
def configuredNovaPlayIntegrityProject
try {
    configuredNovaVersionCode = Integer.parseInt(configuredNovaVersionCodeText)
} catch (NumberFormatException ignored) {
    throw new GradleException('novaVersionCode/NOVA_VERSION_CODE must be an integer')
}
try {
    configuredNovaPlayIntegrityProject = Long.parseLong(configuredNovaPlayIntegrityProjectText)
} catch (NumberFormatException ignored) {
    throw new GradleException('novaPlayIntegrityCloudProjectNumber/NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER must be an integer')
}
if (configuredNovaVersionCode <= 0 || configuredNovaVersionCode > 2100000000) {
    throw new GradleException('Nova versionCode must be between 1 and 2100000000')
}
if (configuredNovaPlayIntegrityProject < 0L) {
    throw new GradleException('Nova Play Integrity Cloud project number must be zero (disabled) or positive')
}
if (!(configuredNovaVersionName ==~ /[0-9A-Za-z][0-9A-Za-z._-]{0,49}/)) {
    throw new GradleException('Nova versionName must be 1-50 characters using letters, numbers, dot, underscore or hyphen')
}
def buildConfigString = { String value ->
    value.replace('\\', '\\\\').replace('"', '\\"').replace('\r', '').replace('\n', '')
}

android {
    compileSdk versions.sdk.compile
    defaultConfig {
        // Candidate production identity. Google Play Console remains the final authority until the
        // app record is created; this id can still be changed before the first Play upload.
        applicationId "com.wpuu.novacalculator"
        minSdkVersion versions.sdk.min
        targetSdkVersion versions.sdk.target
        // Default scheme: major*1,000,000 + minor*10,000 + patch*100 + build.
        // CI/release automation may override both values without editing source.
        versionCode configuredNovaVersionCode
        versionName configuredNovaVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // These are Nova-owned public endpoints. Upstream provider URLs never belong in the APK.
        // AI actions remain hidden until both URLs and a production installation proof adapter exist.
        buildConfigField 'String', 'NOVA_AI_GATEWAY_URL', '"' + buildConfigString(configuredNovaGatewayUrl) + '"'
        buildConfigField 'String', 'NOVA_ANONYMOUS_SESSION_URL', '"' + buildConfigString(configuredNovaSessionUrl) + '"'
        buildConfigField 'String', 'NOVA_BILLING_URL', '"' + buildConfigString(configuredNovaBillingUrl) + '"'
        // Google Cloud project numbers are public identifiers, not credentials. Zero keeps the
        // Play Integrity proof path disabled in development builds.
        buildConfigField 'long', 'NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER', configuredNovaPlayIntegrityProject + 'L'
    }
    buildFeatures {
        buildConfig true
        dataBinding true
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
        }
        debug {
            // Keep all development/test APKs isolated from the candidate production Play identity.
            applicationIdSuffix ".dev"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-debug.cfg'
            multiDexEnabled true
        }
    }
    // Source namespace remains inherited during refactor; applicationId is already isolated.
    namespace 'org.solovyev.android.calculator'
    lint {
        abortOnError false
        disable 'ContentDescription', 'IconLauncherShape'
        warning 'MissingTranslation'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${versions.kotlin}"

    implementation "androidx.viewpager:viewpager:1.1.0-alpha01"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.activity:activity:1.9.2"
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.play:integrity:1.6.0'
    // Current supported Play Billing line for the commercial entitlement implementation.
    implementation 'com.android.billingclient:billing:9.1.0'

    implementation ':measure:'
    implementation ':square-otto:1.3.9-SNAPSHOT'
    kapt ':square-otto:1.3.9-SNAPSHOT'
    kapt ':square-otto-compiler:1.3.9-SNAPSHOT'
    kapt 'com.squareup:javapoet:1.13.0'
    implementation project(':plotter:lib')
    implementation project(':dragbutton')
    implementation(project(':jscl')) {
        exclude(module: 'xercesImpl')
    }

    implementation 'com.google.guava:guava:32.1.2-android'
    implementation('org.simpleframework:simple-xml:2.7.1') {
        exclude(module: 'stax')
        exclude(module: 'stax-api')
        exclude(module: 'xpp3')
    }

    implementation 'com.google.dagger:dagger:2.0.2'
    kapt "com.google.dagger:dagger-compiler:2.0.2"
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    kapt "javax.annotation:javax.annotation-api:1.3.2"

    // CameraX is retained only for the explicit Underwater Camera tool.
    implementation("androidx.camera:camera-core:1.3.1")
    implementation("androidx.camera:camera-camera2:1.3.1")
    implementation("androidx.camera:camera-lifecycle:1.3.1")
    implementation("androidx.camera:camera-view:1.3.1")
    implementation("androidx.camera:camera-video:1.3.1")

    testImplementation 'junit:junit:4.13.2'
    // Android exposes org.json at runtime; this JVM-only dependency keeps the Nova JSON contract
    // testable without adding another serialization library to the APK.
    testImplementation 'org.json:json:20240303'
    testImplementation 'net.sf.opencsv:opencsv:2.0'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'org.skyscreamer:jsonassert:1.5.0'
    testImplementation(name: 'org.apache.http.legacy', ext: 'jar')

    androidTestImplementation 'androidx.annotation:annotation:1.8.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'org.hamcrest:hamcrest-library:1.3'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
    })
}

tasks.withType(Test) {
    scanForTestClasses = false
    include "**/*Test.class"
    exclude "**/*BaseCalculatorTest*"
    exclude "**/*AndroidCalculatorEditorViewTest*"
    exclude "**/*CalculatorWizardActivityTest*"
    exclude "**/*OnScreenCalculatorWizardStepTest*"
    exclude "**/*CalculatorWizardTest*"
    exclude "**/*WizardStepTest*"
    exclude "**/*AngleUnitsButtonTest*"
    exclude "**/*NumeralBasesButtonTest*"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
