name: Chrome Macro E2E

on:
  pull_request:
    branches:
      - commercial/nova-ai-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify Macro static and state-machine guards
        run: |
          node tools/verify-macro-poc.mjs
          node tools/macro-background-state-eval.mjs

      - name: Install Puppeteer with Chrome for Testing
        run: npm install --no-save puppeteer@25.10.0

      - name: Run real unpacked MV3 record/replay E2E
        run: node tools/macro-extension-e2e.mjs
