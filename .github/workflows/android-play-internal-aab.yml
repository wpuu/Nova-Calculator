name: Build Play Internal AAB

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commercial source branch/ref to build
        required: true
        default: 'commercial/nova-ai-v1'
        type: string
      version_code:
        description: Google Play versionCode (must increase for every uploaded build)
        required: true
        default: '20001'
        type: string
      version_name:
        description: User-visible versionName
        required: true
        default: '0.2.0-alpha01'
        type: string

permissions:
  contents: read

jobs:
  build-play-internal-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOVA_ANDROID_PACKAGE_NAME: ${{ vars.NOVA_ANDROID_PACKAGE_NAME }}
      NOVA_AI_GATEWAY_URL: ${{ vars.NOVA_AI_GATEWAY_URL }}
      NOVA_ANONYMOUS_SESSION_URL: ${{ vars.NOVA_ANONYMOUS_SESSION_URL }}
      NOVA_BILLING_URL: ${{ vars.NOVA_BILLING_URL }}
      NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ vars.NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
      NOVA_VERSION_CODE: ${{ inputs.version_code }}
      NOVA_VERSION_NAME: ${{ inputs.version_name }}
      NOVA_UPLOAD_STORE_PASSWORD: ${{ secrets.NOVA_UPLOAD_STORE_PASSWORD }}
      NOVA_UPLOAD_KEY_ALIAS: ${{ secrets.NOVA_UPLOAD_KEY_ALIAS }}
      NOVA_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVA_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout commercial source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Adapt pinned plotter library for current Android Gradle Plugin
        run: |
          cat > plotter/lib/build.gradle <<'EOF'
          apply plugin: 'com.android.library'

          android {
              namespace 'org.solovyev.android.plotter'
              compileSdk 36

              defaultConfig {
                  minSdk 21
                  targetSdk 36
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.annotation:annotation:1.8.2'
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          root = Path('plotter/lib/src/main/java')
          for path in root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('android.support.annotation.', 'androidx.annotation.')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify repository source guard
        run: bash scripts/verify-commercial-source.sh

      - name: Verify required GitHub configuration is present
        env:
          NOVA_UPLOAD_KEYSTORE_B64: ${{ secrets.NOVA_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -eu
          test -n "$NOVA_ANDROID_PACKAGE_NAME"
          test -n "$NOVA_AI_GATEWAY_URL"
          test -n "$NOVA_ANONYMOUS_SESSION_URL"
          test -n "$NOVA_BILLING_URL"
          test -n "$NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER"
          test -n "$NOVA_UPLOAD_KEYSTORE_B64"
          test -n "$NOVA_UPLOAD_STORE_PASSWORD"
          test -n "$NOVA_UPLOAD_KEY_ALIAS"
          test -n "$NOVA_UPLOAD_KEY_PASSWORD"

      - name: Materialize upload keystore
        env:
          NOVA_UPLOAD_KEYSTORE_B64: ${{ secrets.NOVA_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/nova-play-signing"
          printf '%s' "$NOVA_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nova-play-signing/nova-upload.jks"
          test -s "$RUNNER_TEMP/nova-play-signing/nova-upload.jks"
          chmod 600 "$RUNNER_TEMP/nova-play-signing/nova-upload.jks"
          echo "NOVA_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/nova-play-signing/nova-upload.jks" >> "$GITHUB_ENV"

      - name: Test gateway
        run: cd gateway && npm test

      - name: Test commercial Android contracts
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'org.solovyev.android.calculator.entitlement.*Test' \
            --tests 'org.solovyev.android.calculator.ai.*Test' \
            --tests 'org.solovyev.android.calculator.billing.*Test' \
            --tests 'org.solovyev.android.calculator.autoclicker.*Test' \
            --tests 'org.solovyev.android.calculator.analytics.*Test' \
            --stacktrace --no-daemon

      - name: Verify Play release configuration
        run: ./gradlew :app:verifyNovaPlayReleaseConfig --stacktrace --no-daemon

      - name: Build signed release AAB
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: Collect release artifact
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/bundle/release/app-release.aab build-artifacts/Nova-AutoTap-${{ inputs.version_name }}-${{ inputs.version_code }}.aab
          sha256sum build-artifacts/*.aab | tee build-artifacts/SHA256SUMS.txt

      - name: Upload signed Internal Testing AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nova-AutoTap-Play-Internal-${{ inputs.version_code }}
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14
