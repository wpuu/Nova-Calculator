name: Android Release Lint Audit

on:
  push:
    branches:
      - commercial/nova-ai-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-lint-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Adapt pinned plotter library for current Android Gradle Plugin
        run: |
          cat > plotter/lib/build.gradle <<'EOF'
          apply plugin: 'com.android.library'

          android {
              namespace 'org.solovyev.android.plotter'
              compileSdk 36

              defaultConfig {
                  minSdk 21
                  targetSdk 36
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.annotation:annotation:1.8.2'
          }
          EOF

          python3 - <<'PY2'
          from pathlib import Path
          root = Path('plotter/lib/src/main/java')
          count = 0
          for path in root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('android.support.annotation.', 'androidx.annotation.')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  count += 1
          print(f'Migrated AndroidX annotation imports in {count} Plotter Java files')
          PY2

      - name: Run release lint audit
        run: ./gradlew :app:lintRelease --stacktrace --no-daemon

      - name: Fail on release lint errors and print findings
        shell: bash
        run: |
          set -euo pipefail
          REPORT="app/build/reports/lint-results-release.xml"
          test -s "$REPORT"
          python3 - "$REPORT" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = sys.argv[1]
          root = ET.parse(report).getroot()
          errors = []
          warnings = []
          for issue in root.findall('issue'):
              severity = issue.attrib.get('severity', '')
              item = {
                  'id': issue.attrib.get('id', ''),
                  'message': issue.attrib.get('message', ''),
                  'locations': [
                      (loc.attrib.get('file', ''), loc.attrib.get('line', ''))
                      for loc in issue.findall('location')
                  ],
              }
              if severity in ('Error', 'Fatal'):
                  errors.append(item)
              elif severity == 'Warning':
                  warnings.append(item)

          print(f'Release lint: {len(errors)} errors/fatals, {len(warnings)} warnings')
          for index, issue in enumerate(errors[:200], 1):
              location = issue['locations'][0] if issue['locations'] else ('', '')
              print(f"ERROR {index}: {issue['id']} {location[0]}:{location[1]} — {issue['message']}")

          if errors:
              sys.exit(1)
          PY

      - name: Upload release lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Calculator-release-lint-report
          path: |
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
