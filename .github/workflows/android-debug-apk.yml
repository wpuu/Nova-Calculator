name: Android Debug APK

on:
  push:
    branches:
      - fix/autoclicker-overlay-controls
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        if: success()
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/Nova-Calculator-autoclicker-test.apk
          sha256sum build-artifacts/Nova-Calculator-autoclicker-test.apk | tee build-artifacts/SHA256SUMS.txt

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Calculator-autoclicker-debug-apk
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14
