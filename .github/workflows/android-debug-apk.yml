name: Android Debug APK

on:
  push:
    branches:
      - main
      - commercial/nova-ai-v1
  pull_request:
    branches:
      - main
      - commercial/nova-ai-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Adapt pinned plotter library for current Android Gradle Plugin
        run: |
          cat > plotter/lib/build.gradle <<'EOF'
          apply plugin: 'com.android.library'

          android {
              namespace 'org.solovyev.android.plotter'
              compileSdk 36

              defaultConfig {
                  minSdk 21
                  targetSdk 36
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.annotation:annotation:1.8.2'
          }
          EOF

          python3 - <<'PY2'
          from pathlib import Path
          root = Path('plotter/lib/src/main/java')
          count = 0
          for path in root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('android.support.annotation.', 'androidx.annotation.')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  count += 1
          print(f'Migrated AndroidX annotation imports in {count} Plotter Java files')
          PY2

      - name: Verify commercial source guard
        run: bash scripts/verify-commercial-source.sh

      - name: Verify Nova Android identities
        run: bash scripts/verify-nova-identities.sh

      - name: Verify production release guard contract
        env:
          NOVA_AI_GATEWAY_URL: https://ci.nova-calculator.dev/api/ai
          NOVA_ANONYMOUS_SESSION_URL: https://ci.nova-calculator.dev/api/session
          NOVA_BILLING_URL: https://ci.nova-calculator.dev/api/billing
          NOVA_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: '123456789'
          NOVA_VERSION_CODE: '20001'
          NOVA_VERSION_NAME: 0.2.0-ci
        run: |
          if env -u NOVA_BILLING_URL bash scripts/verify-production-release-config.sh >/dev/null 2>&1; then
            echo 'Production release guard unexpectedly accepted missing billing URL' >&2
            exit 1
          fi
          bash scripts/verify-production-release-config.sh

      - name: Verify Accessibility disclosure and scope
        run: bash scripts/verify-accessibility-disclosure.sh

      - name: Test gateway capacity core
        run: cd gateway && npm test

      - name: Test commercial core contracts
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'org.solovyev.android.calculator.entitlement.*Test' \
            --tests 'org.solovyev.android.calculator.ai.*Test' \
            --tests 'org.solovyev.android.calculator.billing.*Test' \
            --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build unsigned release AAB preflight
        run: |
          ./gradlew :app:bundleRelease --stacktrace --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Collect APK
        if: success()
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/Nova-Calculator-commercial-debug.apk
          sha256sum build-artifacts/Nova-Calculator-commercial-debug.apk | tee build-artifacts/SHA256SUMS.txt

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Calculator-commercial-debug-apk
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14
