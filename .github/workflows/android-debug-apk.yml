name: Android Debug APK

on:
  push:
    branches:
      - main
      - commercial/nova-ai-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Adapt pinned plotter library for current Android Gradle Plugin
        run: |
          cat > plotter/lib/build.gradle <<'EOF'
          apply plugin: 'com.android.library'

          android {
              namespace 'org.solovyev.android.plotter'
              compileSdk 36

              defaultConfig {
                  minSdk 21
                  targetSdk 36
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.annotation:annotation:1.8.2'
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          root = Path('plotter/lib/src/main/java')
          count = 0
          for path in root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('android.support.annotation.', 'androidx.annotation.')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  count += 1
          print(f'Migrated AndroidX annotation imports in {count} Plotter Java files')
          PY

      - name: Verify commercial source guard
        run: bash scripts/verify-commercial-source.sh

      - name: Test gateway capacity core
        run: cd gateway && npm test

      - name: Test commercial core contracts
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'org.solovyev.android.calculator.entitlement.DefaultEntitlementManagerTest' \
            --tests 'org.solovyev.android.calculator.ai.*Test' \
            --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        if: success()
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/Nova-Calculator-commercial-debug.apk
          sha256sum build-artifacts/Nova-Calculator-commercial-debug.apk | tee build-artifacts/SHA256SUMS.txt

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Calculator-commercial-debug-apk
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14
