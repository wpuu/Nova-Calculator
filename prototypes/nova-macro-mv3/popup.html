<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nova Macro POC</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 300px; padding: 12px; }
    button { width: 100%; margin: 4px 0; padding: 8px; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; background: #f4f4f4; padding: 8px; }
  </style>
</head>
<body>
  <strong>Nova Macro Semantic POC</strong>
  <button id="start">Start recording</button>
  <button id="stop">Stop & save</button>
  <button id="replay">Replay last macro</button>
  <button id="grant">Allow this site & resume</button>
  <button id="state">Read state</button>
  <pre id="output">Ready.</pre>
  <script src="popup.js"></script>
</body>
</html>
